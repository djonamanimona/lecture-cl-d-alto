<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture Clé d'Alto</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --red: #d94f4f;
    --green: #4fba7c;
    --muted: #5a5a6e;
    --text: #e8e0d0;
    --staff: #c8bfa8;
  }
  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 15% 30%, rgba(201,168,76,0.06) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 70%, rgba(79,186,124,0.04) 0%, transparent 55%);
    pointer-events: none;
  }
  .container { width: 100%; max-width: 580px; position: relative; z-index: 1; }

  header { text-align: center; margin-bottom: 28px; }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 900;
    color: var(--gold-light);
    letter-spacing: -0.02em;
  }
  header p { font-size: 0.65rem; color: var(--muted); margin-top: 6px; letter-spacing: 0.18em; text-transform: uppercase; }

  /* NAV */
  .nav-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.65rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase;
    text-decoration: none; margin-bottom: 20px;
    transition: color 0.2s;
  }
  .nav-link:hover { color: var(--gold-light); }
  .nav-link svg { width: 12px; height: 12px; fill: currentColor; }

  /* SCORE BAR */
  .score-bar {
    display: flex; justify-content: space-between;
    background: var(--surface); border: 1px solid #2a2a35;
    border-radius: 12px; padding: 14px 20px; margin-bottom: 16px;
  }
  .score-item { text-align: center; }
  .score-item .lbl { display: block; font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 3px; }
  .score-item .val { font-size: 1.2rem; font-weight: 500; }
  .val.g { color: var(--green); } .val.r { color: var(--red); } .val.n { color: var(--gold-light); }

  .progress-wrap { height: 3px; background: #2a2a35; border-radius: 99px; margin-bottom: 22px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 99px; transition: width 0.4s ease; }

  /* CARD */
  .card { background: var(--surface); border: 1px solid #2a2a35; border-radius: 20px; padding: 28px 24px; }

  /* STAFF AREA */
  .staff-zone { margin-bottom: 24px; }
  .staff-label { font-size: 0.63rem; color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 14px; text-align: center; }
  .staff-wrap {
    background: #1a1a20;
    border: 1px solid #2a2a35;
    border-radius: 14px;
    padding: 16px 10px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #staffSvg { width: 100%; max-width: 480px; display: block; }

  /* NOTE POSITION HINT */
  .position-hint {
    text-align: center;
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 10px;
    letter-spacing: 0.08em;
    min-height: 18px;
    transition: all 0.3s;
  }

  /* ANSWER GRID */
  .answer-lbl { font-size: 0.63rem; color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 12px; }
  .notes-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
  .note-btn {
    aspect-ratio: 1;
    border-radius: 10px;
    border: 1.5px solid #2a2a35;
    background: var(--surface2);
    color: var(--text);
    font-family: 'Playfair Display', serif;
    font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .note-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-light); transform: translateY(-2px); }
  .note-btn.correct { border-color: var(--green); background: rgba(79,186,124,0.12); color: var(--green); animation: popIn 0.3s ease; }
  .note-btn.wrong { border-color: var(--red); background: rgba(217,79,79,0.12); color: var(--red); animation: shake 0.35s ease; }
  .note-btn.reveal { border-color: var(--green); background: rgba(79,186,124,0.08); color: var(--green); }
  .note-btn:disabled { cursor: not-allowed; }

  @keyframes popIn { 0%{transform:scale(0.9)} 60%{transform:scale(1.08)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 60%{transform:translateX(5px)} }

  .feedback { margin-top: 16px; min-height: 24px; text-align: center; font-size: 0.82rem; letter-spacing: 0.04em; }
  .feedback.correct { color: var(--green); } .feedback.wrong { color: var(--red); }

  .next-btn {
    width: 100%; padding: 13px; border-radius: 12px;
    border: 1.5px solid var(--gold); background: transparent;
    color: var(--gold-light); font-family: 'DM Mono', monospace;
    font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s ease; margin-top: 10px; display: none;
  }
  .next-btn:hover { background: rgba(201,168,76,0.1); }
  .next-btn.visible { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  /* RESULTS */
  .results-screen { display: none; text-align: center; padding: 10px 0; }
  .results-screen.visible { display: block; animation: fadeIn 0.5s ease; }
  .big-score { font-family: 'Playfair Display', serif; font-size: 5rem; font-weight: 900; color: var(--gold-light); line-height: 1; }
  .score-sub { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 8px; margin-bottom: 26px; }
  .results-detail { display: flex; justify-content: center; gap: 48px; margin-bottom: 26px; }
  .rd-item .rv { font-size: 2.2rem; font-weight: 500; }
  .rd-item .rl { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; }
  .results-msg { font-size: 0.86rem; color: var(--text); margin-bottom: 24px; line-height: 1.65; opacity: 0.8; }
  .restart-btn {
    width: 100%; padding: 15px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: #0d0d0f; font-family: 'DM Mono', monospace;
    font-size: 0.78rem; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500;
    cursor: pointer; transition: all 0.2s ease;
  }
  .restart-btn:hover { opacity: 0.9; transform: translateY(-1px); }

  /* CLEF REFERENCE TOOLTIP */
  .ref-bar {
    display: flex; justify-content: center; align-items: center; gap: 8px;
    margin-top: 14px; padding: 10px 16px;
    background: rgba(201,168,76,0.05);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 10px;
    font-size: 0.62rem; color: var(--muted); letter-spacing: 0.08em;
  }
  .ref-bar span.highlight { color: var(--gold-light); font-weight: 500; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Lecture Alto</h1>
    <p>Clé d'ut 3 · Première année</p>
  </header>

  <div class="score-bar">
    <div class="score-item"><span class="lbl">Question</span><span class="val n" id="noteCount">1 / 20</span></div>
    <div class="score-item"><span class="lbl">Bonnes</span><span class="val g" id="goodCount">0</span></div>
    <div class="score-item"><span class="lbl">Fausses</span><span class="val r" id="badCount">0</span></div>
    <div class="score-item"><span class="lbl">Score</span><span class="val n" id="scorePct">—</span></div>
  </div>

  <div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="card">
    <div id="gameArea">
      <div class="staff-zone">
        <div class="staff-label">Quelle est cette note ?</div>
        <div class="staff-wrap">
          <svg id="staffSvg" viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="position-hint" id="posHint"></div>
      </div>

      <div class="answer-lbl">Clique sur la bonne note</div>
      <div class="notes-grid" id="notesGrid"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Question suivante →</button>

      <div class="ref-bar">
        Rappel clé d'alto : <span class="highlight">Do</span> est sur la <span class="highlight">3ᵉ ligne</span>
      </div>
    </div>

    <div class="results-screen" id="resultsScreen">
      <div class="big-score" id="finalScore">0%</div>
      <div class="score-sub">Score final · 20 questions</div>
      <div class="results-detail">
        <div class="rd-item"><div class="rv g" id="finalGood">0</div><div class="rl">Bonnes</div></div>
        <div class="rd-item"><div class="rv r" id="finalBad">0</div><div class="rl">Fausses</div></div>
      </div>
      <div class="results-msg" id="resultsMsg"></div>
      <button class="restart-btn" onclick="startGame()">Recommencer</button>
    </div>
  </div>
</div>

<script>
// ─── Music Theory: Alto Clef (clé d'ut 3) ────────────────────────────────────
//
// Staff layout: 5 lines, spacing = 14px between lines
// Line positions (y): line1=28, line2=42, line3=56, line4=70, line5=84
// In alto clef: Do (C4) sits ON line 3 (y=56)
//
// Note positions (stepIndex = 0 means Do4 on line 3)
// Each step = 7px (half a space), going UP = y decreases
//
// We map note names to stepIndex relative to Do4 (line3):
// Do4=0, Ré4=1, Mi4=2, Fa4=3, Sol4=4, La4=5, Si4=6,
// Do5=7, Ré5=8, Mi5=9
// Below: Si3=-1, La3=-2, Sol3=-3, Fa3=-4, Mi3=-5, Ré3=-6, Do3=-7

const STAFF_Y1 = 30;   // top line y
const STEP = 7;        // half-space = one note step in pixels
const LINE_SPACING = STEP * 2; // 14px between lines

// All notes we use (from Ré3 to Ré5, with a couple ledger lines)
const ALL_NOTES = [
  { name: 'Ré',  octave: 3, step: -6 },
  { name: 'Mi',  octave: 3, step: -5 },
  { name: 'Fa',  octave: 3, step: -4 },
  { name: 'Sol', octave: 3, step: -3 },
  { name: 'La',  octave: 3, step: -2 },
  { name: 'Si',  octave: 3, step: -1 },
  { name: 'Do',  octave: 4, step:  0 },
  { name: 'Ré',  octave: 4, step:  1 },
  { name: 'Mi',  octave: 4, step:  2 },
  { name: 'Fa',  octave: 4, step:  3 },
  { name: 'Sol', octave: 4, step:  4 },
  { name: 'La',  octave: 4, step:  5 },
  { name: 'Si',  octave: 4, step:  6 },
  { name: 'Do',  octave: 5, step:  7 },
  { name: 'Ré',  octave: 5, step:  8 },
];

const NOTE_NAMES = ['Do', 'Ré', 'Mi', 'Fa', 'Sol', 'La', 'Si'];

// stepIndex → y coordinate on SVG
// Do4 (step=0) is on line 3 → y = STAFF_Y1 + 2*LINE_SPACING = 30 + 28 = 58
function stepToY(step) {
  const do4Y = STAFF_Y1 + 2 * LINE_SPACING; // line 3
  return do4Y - step * STEP;
}

// Which staff line y-values
function staffLineYs() {
  return [0,1,2,3,4].map(i => STAFF_Y1 + i * LINE_SPACING);
}

// ─── SVG Drawing ─────────────────────────────────────────────────────────────
function drawStaff(noteObj, revealed = false, correct = null) {
  const svg = document.getElementById('staffSvg');
  svg.innerHTML = '';
  const W = 480, H = 140;
  const staffColor = '#8a8070';
  const noteColor = revealed
    ? (correct ? '#4fba7c' : '#d94f4f')
    : '#e8c97a';

  // Staff lines
  const lines = staffLineYs();
  lines.forEach(y => {
    const line = makeSVG('line', { x1: 60, y1: y, x2: W - 40, y2: y, stroke: staffColor, 'stroke-width': 1.2 });
    svg.appendChild(line);
  });

  // Alto clef symbol (drawn as path — authentic C clef shape)
  drawAltoClef(svg, 12, STAFF_Y1, LINE_SPACING);

  // Note position
  const noteY = stepToY(noteObj.step);
  const noteX = W / 2 + 20;
  const rx = 10, ry = 7;

  // Ledger lines (if note is above or below staff)
  drawLedgerLines(svg, noteObj.step, noteX, rx, staffColor);

  // Note head (filled ellipse, slightly tilted)
  const ellipse = makeSVG('ellipse', {
    cx: noteX, cy: noteY,
    rx: rx, ry: ry,
    fill: noteColor,
    transform: `rotate(-20, ${noteX}, ${noteY})`
  });
  svg.appendChild(ellipse);

  // Stem
  const stemDir = noteObj.step >= 2 ? 1 : -1; // up for lower notes, down for higher
  const stemX = stemDir === -1 ? noteX + rx - 1 : noteX - rx + 1;
  const stemY1 = noteY;
  const stemY2 = noteY + stemDir * 38;
  const stem = makeSVG('line', {
    x1: stemX, y1: stemY1, x2: stemX, y2: stemY2,
    stroke: noteColor, 'stroke-width': 1.8
  });
  svg.appendChild(stem);
}

function drawLedgerLines(svg, step, noteX, rx, color) {
  const lx1 = noteX - rx - 6, lx2 = noteX + rx + 6;
  const lines = staffLineYs();

  // Above staff: step >= 9 means above line 1
  // Below staff: step <= -7 means below line 5
  // Lines above staff: step 9=above line1, 11, 13...
  // Lines below staff: step -7=below line5, -9...

  // Check each possible ledger line position
  // Ledger lines sit at even step values that are outside the staff
  // Staff spans step -8 (below line5) to step 9 (above line1)
  // Line1 = step 8, Line2 = step 6 (wait — let's map properly)
  // Line1(top) y=STAFF_Y1 → step = (do4Y - STAFF_Y1)/STEP = (58-30)/7 = 4 → step 8
  // Line2 y=STAFF_Y1+14 → step = (58-44)/7 = 2 → step 6 (wait 58-44=14, 14/7=2) → step 6... 
  // Actually: do4Y=58, line1_y=30 → step=(58-30)/7=4. That's step 8.
  // line2_y=44 → step=(58-44)/7=2 → step 6? No: (58-44)/7 = 2 → step 2? 
  // Let me recalc: stepToY(s) = 58 - s*7
  // line1 y=30: 58 - s*7=30 → s=4. So line1 is step 4? That's wrong for alto.
  // 
  // Actually I need to re-examine. staffY1=30 is top line. 
  // Lines at y: 30,44,58,72,86
  // Line3=y58=do4 → step0 ✓
  // Line1=y30 → step = (58-30)/7 = 4 → step 8 (since each line=2 steps apart) → step 8
  // Line2=y44 → step = (58-44)/7=2 → step 6? 14/7=2 → step... 
  // stepToY(6) = 58 - 6*7 = 58-42=16? That's not right.
  // 
  // Oh wait, step is by half-space so each SPACE is 2 steps, each LINE is 2 steps from adjacent.
  // stepToY(s) = 58 - s*7
  // stepToY(0) = 58 (line3=Do4) ✓
  // stepToY(2) = 44 → that's line2
  // stepToY(4) = 30 → that's line1 (top)
  // stepToY(-2) = 72 → line4
  // stepToY(-4) = 86 → line5 (bottom)
  //
  // So line positions in steps: line1=+4, line2=+2, line3=0, line4=-2, line5=-4
  // Space positions (between lines): +5,+3,+1,-1,-3
  //
  // Ledger lines needed:
  // Above staff: for step >= 6 (above line1=4), ledger at even steps: 6,8,10...
  //   But we only need a ledger line if note is AT that step or beyond
  //   e.g. step=6 (space above line1, between line1 and first ledger) → need ledger at step 6? No.
  //   step=8: sits on first ledger line above staff → draw ledger at step 8
  //   step=9: sits in space above first ledger → draw ledger at step 8
  //   step=10 or 11: draw ledger at step 8 AND 10
  //
  // Below staff: step <= -6 (below line5=-4)
  //   step=-6: space below staff, ledger at -6? No.
  //   step=-8: sits on first ledger below → draw ledger at -8... 
  //   But our range only goes to step=-6 (Ré3), let me check:
  //   Ré3 step=-6: stepToY(-6)=58+42=100. That's below line5(y=86). It's in space below staff.
  //   It needs a ledger line at step=-6 to show where it is? 
  //   Actually no: ledger lines are drawn AT the note if the note is on a ledger line step,
  //   or at each even step that the note passes.
  //
  // Rule: draw ledger lines for each "line" step (even values) outside staff that the note is at or beyond.
  // Staff lines: -4,-2,0,+2,+4. Outside = step <= -6 or step >= 6 (even).
  // For step=-6: draw ledger at y=stepToY(-6)=100
  // For step=-5 (Mi3): draw ledger at -6 (the closest even step below staff)? 
  //   Actually Mi3 step=-5 → y=58+35=93. Line5=y86. Mi3 is just below line5, no ledger needed.
  //   Wait: -4 is line5, -5 is space just below line5. No ledger needed for -5.
  //   -6 is a ledger line step, -7 is space below that ledger.
  //   So for notes at step -6 or -7, we draw a ledger at step -6.
  //
  // In our note set:
  //   Ré3 (step=-6): IS on ledger line → draw ledger at -6
  //   Mi3 (step=-5): between line5 and ledger → NO ledger needed
  //   Above: Do5 (step=7): between line1(step4) and first upper ledger → no ledger yet
  //     Wait step7: space above line1? line1=step4, above it: step5 (space), step6 (ledger line), step7 (space above ledger)
  //     Do5 step=7 is space between line1 and first ledger → no ledger needed? 
  //     Actually: stepToY(7)=58-49=9. y=9 which is way above line1(y=30). Let me check step ranges again.
  //   
  //   Hmm, there's an inconsistency. Let me be precise:
  //   stepToY(7) = 58 - 7*7 = 58 - 49 = 9. That's very high. 
  //   But our SVG viewBox height is 140 and STAFF_Y1=30 (top line). 
  //   step=7 gives y=9, which is above the staff. We need a ledger line there.
  //   Do5 at step=7, draw ledger at step=6: y=stepToY(6)=58-42=16
  //   Ré5 at step=8: IS on ledger at step=8: y=58-56=2 → too high!
  //
  // The viewBox might be too small. Let me adjust the drawing logic to center better.
  // I'll adjust the SVG center. Our notes range step -6 to +8.
  // stepToY(-6)=100, stepToY(8)=2. Range y=[2..100]. Center=51. Staff lines y=[30..86].
  // This fits fine in viewBox 0..140. Just need to make sure we draw ledger lines correctly.

  // Draw ledger lines for notes outside staff
  const lineSteps = [4, 2, 0, -2, -4]; // staff line steps

  if (step >= 6) {
    // need ledger lines at even steps from 6 up to note (or nearest even ≤ note)
    for (let s = 6; s <= step; s += 2) {
      const y = stepToY(s);
      svg.appendChild(makeSVG('line', { x1: lx1, y1: y, x2: lx2, y2: y, stroke: color, 'stroke-width': 1.5 }));
    }
    // also if note is at odd step, draw ledger at step-1 if step-1 >= 6
    if (step % 2 !== 0 && step - 1 >= 6) {
      const y = stepToY(step - 1);
      svg.appendChild(makeSVG('line', { x1: lx1, y1: y, x2: lx2, y2: y, stroke: color, 'stroke-width': 1.5 }));
    }
  }
  if (step <= -6) {
    for (let s = -6; s >= step; s -= 2) {
      const y = stepToY(s);
      svg.appendChild(makeSVG('line', { x1: lx1, y1: y, x2: lx2, y2: y, stroke: color, 'stroke-width': 1.5 }));
    }
    if (step % 2 !== 0 && step + 1 <= -6) {
      const y = stepToY(step + 1);
      svg.appendChild(makeSVG('line', { x1: lx1, y1: y, x2: lx2, y2: y, stroke: color, 'stroke-width': 1.5 }));
    }
  }
  // Special: Do4 on line 3 has no ledger but is a key note — we can skip
}

function drawAltoClef(svg, x, staffY1, spacing) {
  // Draw a simplified but recognizable C-clef (alto) symbol
  // The C-clef looks like a B with a vertical bar on the left
  // We'll draw it using paths
  const midY = staffY1 + 2 * spacing; // line 3 = Do4
  const h = spacing * 4; // full staff height
  const top = staffY1;
  const bot = staffY1 + 4 * spacing;
  const clefColor = '#b0a080';

  // Vertical bar (left)
  svg.appendChild(makeSVG('line', { x1: x + 2, y1: top, x2: x + 2, y2: bot, stroke: clefColor, 'stroke-width': 3, 'stroke-linecap': 'round' }));
  svg.appendChild(makeSVG('line', { x1: x + 6, y1: top, x2: x + 6, y2: bot, stroke: clefColor, 'stroke-width': 1.5, 'stroke-linecap': 'round' }));

  // Upper arch
  const arcR = spacing * 1.1;
  svg.appendChild(makeSVG('path', {
    d: `M ${x+6} ${midY} Q ${x+6+arcR*1.6} ${midY - arcR*1.8} ${x+6+arcR*0.6} ${top}`,
    stroke: clefColor, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round'
  }));
  // Lower arch
  svg.appendChild(makeSVG('path', {
    d: `M ${x+6} ${midY} Q ${x+6+arcR*1.6} ${midY + arcR*1.8} ${x+6+arcR*0.6} ${bot}`,
    stroke: clefColor, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round'
  }));

  // Small dots at middle
  svg.appendChild(makeSVG('circle', { cx: x + 22, cy: midY - 4, r: 2.5, fill: clefColor }));
  svg.appendChild(makeSVG('circle', { cx: x + 22, cy: midY + 4, r: 2.5, fill: clefColor }));
}

function makeSVG(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

// ─── Game State ───────────────────────────────────────────────────────────────
const TOTAL = 20;
let currentNote = null, currentIndex = 0, good = 0, bad = 0, answered = false;

function startGame() {
  good = 0; bad = 0; currentIndex = 0;
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('resultsScreen').classList.remove('visible');
  updateBar();
  newQuestion();
}

function newQuestion() {
  answered = false;
  currentNote = ALL_NOTES[Math.floor(Math.random() * ALL_NOTES.length)];

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').classList.remove('visible');
  document.getElementById('nextBtn').textContent = 'Question suivante →';
  document.getElementById('nextBtn').onclick = nextQuestion;
  document.getElementById('progressFill').style.width = (currentIndex / TOTAL * 100) + '%';
  document.getElementById('noteCount').textContent = (currentIndex + 1) + ' / ' + TOTAL;
  document.getElementById('posHint').textContent = '';

  drawStaff(currentNote, false, null);

  // Rebuild answer buttons
  const grid = document.getElementById('notesGrid');
  grid.innerHTML = '';
  NOTE_NAMES.forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'note-btn';
    btn.textContent = n;
    btn.onclick = () => answer(n, btn);
    grid.appendChild(btn);
  });
}

function answer(name, btn) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.note-btn').forEach(b => b.disabled = true);

  const isCorrect = name === currentNote.name;

  if (isCorrect) {
    btn.classList.add('correct');
    good++;
    document.getElementById('feedback').textContent = '✓ Bravo ! C\'était bien ' + currentNote.name + ' (' + currentNote.octave + ')';
    document.getElementById('feedback').className = 'feedback correct';
    drawStaff(currentNote, true, true);
  } else {
    btn.classList.add('wrong');
    bad++;
    document.querySelectorAll('.note-btn').forEach(b => {
      if (b.textContent === currentNote.name) b.classList.add('reveal');
    });
    document.getElementById('feedback').textContent = '✗ C\'était ' + currentNote.name + ' (' + currentNote.octave + '), pas ' + name;
    document.getElementById('feedback').className = 'feedback wrong';
    drawStaff(currentNote, true, false);
  }

  // Show position hint
  const stepDesc = getPositionDescription(currentNote);
  document.getElementById('posHint').textContent = stepDesc;

  currentIndex++;
  updateBar();

  if (currentIndex >= TOTAL) {
    document.getElementById('nextBtn').textContent = 'Voir les résultats →';
    document.getElementById('nextBtn').onclick = showResults;
  }
  document.getElementById('nextBtn').classList.add('visible');
}

function getPositionDescription(note) {
  const step = note.step;
  const lineSteps = { 4: '1re ligne', 2: '2e ligne', 0: '3e ligne (Do central)', '-2': '4e ligne', '-4': '5e ligne' };
  const spaceSteps = { 5: 'espace au-dessus ligne 1', 3: '1er espace', 1: '2e espace', '-1': '3e espace', '-3': '4e espace', '-5': 'espace sous ligne 5' };

  if (lineSteps[step]) return note.name + ' (' + note.octave + ') → ' + lineSteps[step];
  if (spaceSteps[step]) return note.name + ' (' + note.octave + ') → ' + spaceSteps[step];
  if (step === 6) return note.name + ' (' + note.octave + ') → 1re ligne supplémentaire (haute)';
  if (step === 7) return note.name + ' (' + note.octave + ') → espace au-dessus 1re suppl.';
  if (step === 8) return note.name + ' (' + note.octave + ') → 2e ligne supplémentaire (haute)';
  if (step === -6) return note.name + ' (' + note.octave + ') → 1re ligne supplémentaire (basse)';
  if (step === -7) return note.name + ' (' + note.octave + ') → espace sous 1re suppl.';
  return note.name + ' (' + note.octave + ')';
}

function nextQuestion() { newQuestion(); }

function showResults() {
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  const pct = Math.round((good / TOTAL) * 100);
  document.getElementById('finalScore').textContent = pct + '%';
  document.getElementById('finalGood').textContent = good;
  document.getElementById('finalBad').textContent = bad;
  const msgs = [
    [90, 'Excellent ! Tu lis la clé d\'alto avec aisance. 🎻'],
    [70, 'Très bien ! Continue, la lecture devient instinctive.'],
    [50, 'Bon travail. Attarde-toi sur les lignes supplémentaires.'],
    [30, 'Continue à t\'entraîner, surtout les notes autour du Do central.'],
    [0, 'Persévère ! La clé d\'alto s\'apprivoise avec la répétition.'],
  ];
  document.getElementById('resultsMsg').textContent = msgs.find(([t]) => pct >= t)[1];
  document.getElementById('resultsScreen').classList.add('visible');
}

function updateBar() {
  document.getElementById('goodCount').textContent = good;
  document.getElementById('badCount').textContent = bad;
  const t = good + bad;
  document.getElementById('scorePct').textContent = t > 0 ? Math.round(good / t * 100) + '%' : '—';
}

startGame();
</script>
